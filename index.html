<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDine AI - Retro Edition</title>
  
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Load Babel to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    
    body { 
      margin: 0; 
      font-family: 'Space Mono', monospace; 
      background-color: #e2e8f0; /* slate-200 */
      background-image: 
        linear-gradient(#cbd5e1 1px, transparent 1px),
        linear-gradient(90deg, #cbd5e1 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .retro-shadow {
      box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
    }
    .retro-shadow-sm {
      box-shadow: 3px 3px 0px 0px rgba(0,0,0,1);
    }
    .retro-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
    }

    /* Retro Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border: 4px solid black;
      background: #fde047; /* yellow-300 */
      cursor: pointer;
      margin-top: -8px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: black;
    }

    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-900 pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Chunky Icons ---
    const Utensils = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg>;
    const Brain = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"></path><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"></path><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"></path><path d="M3.477 10.896a4 4 0 0 1 .585-.396"></path><path d="M19.938 10.5a4 4 0 0 1 .585.396"></path><path d="M6 18a4 4 0 0 1-1.967-.516"></path><path d="M19.967 17.484A4 4 0 0 1 18 18"></path></svg>;
    const CheckCircle2 = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const RefreshCw = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;
    const Trash2 = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const MapPin = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>;
    const UserIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
    const Sparkles = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>;
    const ShieldAlert = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>;
    const Target = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>;
    const MapIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" x2="9" y1="3" y2="18"></line><line x1="15" x2="15" y1="6" y2="21"></line></svg>;
    const Navigation = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>;
    const SettingsIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
    const Book = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>;

    // Fetch with Retry
    const fetchWithRetry = async (url, options, retries = 3) => {
      const delays = [1000, 2000, 4000];
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            const errorBody = await response.json().catch(() => ({}));
            throw { status: response.status, message: errorBody.error?.message || response.statusText };
          }
          return await response.json();
        } catch (error) {
          if (i === retries - 1 || error.status === 403 || error.status === 400 || error.status === 404) throw error;
          await new Promise(res => setTimeout(res, delays[i]));
        }
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('nutrisync_api_key') || "");
      const [tempKey, setTempKey] = useState("");
      
      // Selected Gemini Model
      const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem('nutrisync_model') || 'gemini-2.5-flash');

      // BULLETPROOF Personal Info State (Protects against corrupted cache)
      const [profile, setProfile] = useState(() => {
        try {
          const saved = localStorage.getItem('nutrisync_profile_v2');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === 'object') {
              return {
                name: parsed.name || '',
                age: parsed.age || 30,
                weight: parsed.weight || 160,
                height: parsed.height || 68,
                sex: parsed.sex || 'male',
                activityLevel: parsed.activityLevel || 1.375,
                goal: parsed.goal || 'maintain',
                dietPreference: parsed.dietPreference || '',
                allergies: parsed.allergies || ''
              };
            }
          }
        } catch (e) {
          console.warn("Profile cache corrupted, resetting defaults.");
        }
        return { name: '', age: 30, weight: 160, height: 68, sex: 'male', activityLevel: 1.375, goal: 'maintain', dietPreference: '', allergies: '' };
      });

      // Meal Tuner State
      const [priceLevel, setPriceLevel] = useState('2');
      const [healthLevel, setHealthLevel] = useState('3');

      // BULLETPROOF Meal Log State
      const [meals, setMeals] = useState(() => {
        try {
          const saved = localStorage.getItem('nutrisync_meals');
          if (saved) {
            const parsed = JSON.parse(saved);
            return Array.isArray(parsed) ? parsed : [];
          }
        } catch (e) {
          console.warn("Meal cache corrupted, resetting to empty.");
        }
        return [];
      });

      const [aiLoading, setAiLoading] = useState(false);
      const [currentRecommendation, setCurrentRecommendation] = useState(null);
      const [aiError, setAiError] = useState('');
      const [userLocation, setUserLocation] = useState(null);
      const [locationStatus, setLocationStatus] = useState('idle');

      useEffect(() => { localStorage.setItem('nutrisync_meals', JSON.stringify(meals || [])); }, [meals]);
      useEffect(() => { localStorage.setItem('nutrisync_profile_v2', JSON.stringify(profile || {})); }, [profile]);
      useEffect(() => { localStorage.setItem('nutrisync_model', selectedModel); }, [selectedModel]);

      // --- Smart Calorie & Macro Calculator ---
      const goals = useMemo(() => {
        const safeProfile = profile || {};
        const weightKg = (safeProfile.weight || 160) * 0.453592;
        const heightCm = (safeProfile.height || 68) * 2.54;
        const age = safeProfile.age || 30;
        const activityLevel = Number(safeProfile.activityLevel) || 1.375;
        
        let bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age);
        bmr = safeProfile.sex === 'male' ? bmr + 5 : bmr - 161;

        let tdee = bmr * activityLevel;

        if (safeProfile.goal === 'lose') tdee -= 500;
        if (safeProfile.goal === 'build') tdee += 300;

        const goalCalories = Math.round(tdee);
        const goalProtein = Math.round((goalCalories * 0.30) / 4);
        const goalCarbs = Math.round((goalCalories * 0.40) / 4);
        const goalFat = Math.round((goalCalories * 0.30) / 9);
        const goalFiber = 30; // Recommended daily fiber (g)
        const goalSodium = 2300; // Recommended max daily sodium (mg)
        const goalCaffeine = 400; // Safe daily caffeine limit (mg)

        return { calories: goalCalories, protein: goalProtein, carbs: goalCarbs, fat: goalFat, fiber: goalFiber, sodium: goalSodium, caffeine: goalCaffeine };
      }, [profile]);

      const totals = (meals || []).reduce((acc, meal) => ({
        calories: acc.calories + (Number(meal?.calories) || 0),
        protein: acc.protein + (Number(meal?.protein) || 0),
        carbs: acc.carbs + (Number(meal?.carbs) || 0),
        fat: acc.fat + (Number(meal?.fat) || 0),
        fiber: acc.fiber + (Number(meal?.fiber) || 0),
        sodium: acc.sodium + (Number(meal?.sodium) || 0),
        caffeine: acc.caffeine + (Number(meal?.caffeine) || 0),
      }), { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sodium: 0, caffeine: 0 });

      const remainingCalories = Math.max(0, goals.calories - totals.calories);

      const getCalorieMessage = (eaten, goal) => {
        if (!goal) return "Setting up profile...";
        const ratio = eaten / goal;
        if (ratio === 0) return "Awaiting first meal data...";
        if (ratio < 0.5) return "Fueling up! Keep going.";
        if (ratio < 0.8) return "On track! Stay focused.";
        if (ratio <= 1.0) return "Approaching capacity! Eat clean.";
        if (ratio < 1.2) return "WARNING: Chill out on the snacking!";
        return "OVERLOAD: Time to hit the gym! 🏋️‍♂️";
      };

      // --- Handlers ---
      const saveApiKey = (e) => {
        e.preventDefault();
        localStorage.setItem('nutrisync_api_key', tempKey);
        setApiKey(tempKey);
        setTempKey("");
      };

      const clearApiKey = () => {
        localStorage.removeItem('nutrisync_api_key');
        setApiKey("");
      };

      const handleDeleteMeal = (identifier) => {
        setMeals(prevMeals => (prevMeals || []).filter(m => (m.id || m.name) !== identifier));
      };

      const logRecommendedMeal = () => {
        if (!currentRecommendation) return;
        setMeals(prevMeals => [{
          id: Date.now() + Math.random(),
          name: `${currentRecommendation.restaurant}: ${currentRecommendation.mealName}`,
          calories: currentRecommendation.calories,
          protein: currentRecommendation.protein,
          carbs: currentRecommendation.carbs,
          fat: currentRecommendation.fat,
          fiber: currentRecommendation.fiber,
          sodium: currentRecommendation.sodium,
          caffeine: currentRecommendation.caffeine,
        }, ...(prevMeals || [])]);
        setCurrentRecommendation(null);
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        setActiveTab('dashboard'); // Switch back to dashboard instantly
      };

      const generateMealPlan = async () => {
        if (!apiKey) {
          setActiveTab('settings');
          return;
        }

        setAiLoading(true);
        setLocationStatus('locating');
        setAiError('');
        setCurrentRecommendation(null);

        let locationContext = "Location access denied. Suggest a universally common restaurant chain.";
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000 });
          });
          setUserLocation({ lat: pos.coords.latitude, lon: pos.coords.longitude });
          locationContext = `The user is currently at coordinates: Latitude ${pos.coords.latitude}, Longitude ${pos.coords.longitude}. Find a real restaurant near these coordinates.`;
          
          setLocationStatus('acquired');
          await new Promise(res => setTimeout(res, 1200)); 
        } catch (err) {
          console.warn("Location not provided.");
          setUserLocation(null);
          setLocationStatus('error');
          await new Promise(res => setTimeout(res, 1000));
        }

        setLocationStatus('processing');
        const priceLabel = priceLevel === '1' ? 'Cheap/Fast Food ($)' : priceLevel === '2' ? 'Moderate/Fast Casual ($$)' : 'Expensive/Sit-down ($$$)';
        const healthLabel = healthLevel === '1' ? 'Indulgent/Cheat Meal (Prioritize taste and calories over macros)' : healthLevel === '2' ? 'Balanced (Good macros, decent taste)' : 'Ultra Clean/Super Healthy (Prioritize micronutrients and perfect macros)';

        const prompt = `
          You are a brutally honest, expert AI Dietician. 
          Suggest ONE specific, highly nutritious meal combination from a real restaurant. 
          CRITICAL: VARY YOUR RECOMMENDATIONS widely! Include diverse cuisines (Mediterranean, Sushi, healthy Thai, Indian, local health cafes, upscale grills, Nando's, etc.). DO NOT default to Chipotle.
          
          User Profile:
          - Eaten: ${totals.calories} / ${goals.calories} kcal today.
          - Goal: ${profile?.goal || 'maintain'}
          - Diet Preference: ${profile?.dietPreference || 'Any'}
          - ALLERGIES: ${profile?.allergies || 'None'}. CRITICAL: DO NOT SUGGEST ANY INGREDIENT LISTED HERE! THIS IS LIFE OR DEATH.
          - Location Context: ${locationContext}
          
          Meal Tuner Constraints:
          - Desired Price Range: ${priceLabel}
          - Health/Indulgence Focus: ${healthLabel}
          
          Provide the restaurant, exact order, macros (including fiber in grams, sodium in mg, and caffeine in mg), and a "hype text" explaining why this meal perfectly matches their Tuner constraints, hits their macros, and avoids their allergies.
        `;

        try {
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: "You must return only valid JSON." }] },
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  restaurant: { type: "STRING" },
                  mealName: { type: "STRING" },
                  orderInstructions: { type: "STRING" },
                  calories: { type: "NUMBER" },
                  protein: { type: "NUMBER" },
                  carbs: { type: "NUMBER" },
                  fat: { type: "NUMBER" },
                  fiber: { type: "NUMBER", description: "Fiber content in grams" },
                  sodium: { type: "NUMBER", description: "Sodium content in milligrams" },
                  caffeine: { type: "NUMBER", description: "Caffeine content in milligrams (0 if none)" },
                  estimatedPrice: { type: "STRING" },
                  hypeText: { type: "STRING", description: "Enthusiastic text explaining why this meal is perfect for their goals and safely avoids their allergies." }
                },
                required: ["restaurant", "mealName", "orderInstructions", "calories", "protein", "carbs", "fat", "fiber", "sodium", "caffeine", "estimatedPrice", "hypeText"]
              }
            }
          };

          const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;
          
          const data = await fetchWithRetry(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            setCurrentRecommendation(JSON.parse(text));
          } else {
            throw new Error("Received empty response from the AI model.");
          }
        } catch (err) {
          setAiError(`API Error: ${err.message || "Ensure your API key is correct and supports the selected model."}`);
        } finally {
          setAiLoading(false);
          setLocationStatus('idle');
        }
      };

      if (!apiKey && activeTab !== 'settings') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white border-4 border-black p-8 max-w-md w-full retro-shadow text-center">
              <Sparkles size={48} className="mx-auto mb-6 text-indigo-500" />
              <h2 className="text-2xl font-black mb-4 uppercase tracking-tighter">Insert Coin <br/> (API Key)</h2>
              <p className="text-sm font-bold mb-8">Unlock the Retro AI Assistant.</p>
              
              <form onSubmit={saveApiKey} className="space-y-4">
                <input 
                  type="password"
                  placeholder="Paste Gemini Key..."
                  value={tempKey}
                  onChange={(e) => setTempKey(e.target.value)}
                  className="w-full px-4 py-3 border-4 border-black bg-yellow-50 focus:bg-yellow-100 outline-none font-bold"
                  required
                />
                <button type="submit" className="w-full bg-cyan-400 border-4 border-black font-black py-4 uppercase retro-shadow retro-btn transition-all">
                  Start Game
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto px-4 sm:px-6 pt-8">
          {/* Header */}
          <header className="bg-white border-4 border-black retro-shadow p-4 mb-8 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="bg-yellow-400 border-2 border-black p-2">
                <Brain size={24} />
              </div>
              <h1 className="text-xl md:text-2xl font-black uppercase tracking-tighter">AutoDine.EXE</h1>
            </div>
          </header>

          {/* Consolidated Nav Tabs */}
          <div className="flex gap-4 mb-8">
            {[
              { id: 'dashboard', icon: Utensils, label: 'EAT' },
              { id: 'settings', icon: SettingsIcon, label: 'SETTINGS' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex-1 flex items-center justify-center gap-2 py-4 px-4 border-4 border-black font-black uppercase transition-all retro-btn
                  ${activeTab === tab.id ? 'bg-indigo-500 text-white retro-shadow' : 'bg-white text-black hover:bg-slate-100'}`}
              >
                <tab.icon size={20} /> <span className="inline">{tab.label}</span>
              </button>
            ))}
          </div>

          <main>
            {/* --- DASHBOARD TAB --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8 animate-fade-in">
                
                {/* Player 1 HUD (Profile Summary) */}
                <div className="bg-slate-900 text-lime-400 border-4 border-black retro-shadow p-4 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 bg-lime-400 opacity-20 animate-pulse"></div>
                  
                  <div className="flex justify-between items-end border-b-4 border-slate-700 pb-3 mb-3">
                    <h2 className="text-lg sm:text-xl font-black uppercase tracking-widest flex items-center gap-2">
                      <UserIcon size={20} className="text-cyan-400"/> {profile?.name || 'Player 1'} Stats
                    </h2>
                    <span className="text-xs bg-lime-400 text-black px-2 py-1 font-black">LVL {profile?.age || 30}</span>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-y-3 gap-x-4 text-xs sm:text-sm font-bold uppercase">
                    <div><span className="text-slate-500">Class:</span> <span className="text-white">{profile?.goal === 'lose' ? 'Cut' : profile?.goal === 'build' ? 'Bulk' : 'Maintain'}</span></div>
                    <div><span className="text-slate-500">Weight:</span> <span className="text-white">{profile?.weight || 160} lbs</span></div>
                    <div><span className="text-slate-500">Buffs (Diet):</span> <span className="text-cyan-400">{profile?.dietPreference || 'Any'}</span></div>
                    <div className="flex items-start gap-1">
                      <span className="text-slate-500">Debuffs:</span> 
                      <span className={profile?.allergies ? 'text-red-400 flex items-center gap-1' : 'text-slate-400'}>
                        {profile?.allergies ? <><ShieldAlert size={14}/> {profile.allergies}</> : 'NONE'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Stats Screen */}
                <div className="bg-white border-4 border-black retro-shadow p-6">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b-4 border-black pb-4 mb-4 gap-2">
                    <div>
                      <h2 className="text-sm font-black uppercase">Calories Consumed</h2>
                      <p className={`text-xs font-bold mt-1 ${totals.calories > goals.calories ? 'text-red-500 animate-pulse' : 'text-slate-500'}`}>
                        {getCalorieMessage(totals.calories, goals.calories)}
                      </p>
                    </div>
                    <div className="text-left sm:text-right">
                      <span className={`text-4xl font-black ${totals.calories > goals.calories ? 'text-red-600' : 'text-indigo-600'}`}>{totals.calories}</span>
                      <span className="text-sm font-black text-slate-400"> / {goals.calories} kcal</span>
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
                    <div className="border-2 border-black bg-indigo-100 p-2 text-center">
                      <p className="text-[10px] font-black uppercase">PRO</p>
                      <p className="font-bold text-xs sm:text-sm">{totals.protein}/{goals.protein}g</p>
                    </div>
                    <div className="border-2 border-black bg-yellow-100 p-2 text-center">
                      <p className="text-[10px] font-black uppercase">CRB</p>
                      <p className="font-bold text-xs sm:text-sm">{totals.carbs}/{goals.carbs}g</p>
                    </div>
                    <div className="border-2 border-black bg-lime-100 p-2 text-center">
                      <p className="text-[10px] font-black uppercase">FAT</p>
                      <p className="font-bold text-xs sm:text-sm">{totals.fat}/{goals.fat}g</p>
                    </div>
                    <div className="border-2 border-black bg-orange-100 p-2 text-center">
                      <p className="text-[10px] font-black uppercase">FBR</p>
                      <p className="font-bold text-xs sm:text-sm">{totals.fiber}/{goals.fiber}g</p>
                    </div>
                    <div className="border-2 border-black bg-pink-100 p-2 text-center">
                      <p className="text-[10px] font-black uppercase">SOD</p>
                      <p className="font-bold text-xs sm:text-sm">{totals.sodium}/{goals.sodium}mg</p>
                    </div>
                    <div className="border-2 border-black bg-cyan-100 p-2 text-center">
                      <p className="text-[10px] font-black uppercase">CAF</p>
                      <p className="font-bold text-xs sm:text-sm">{totals.caffeine}/{goals.caffeine}mg</p>
                    </div>
                  </div>
                </div>

                {/* Meal Tuner & AI Recommender */}
                {!currentRecommendation ? (
                  <div className="space-y-8">
                    {/* The Meal Tuner */}
                    <div className="bg-white border-4 border-black retro-shadow p-6">
                      <h3 className="text-lg font-black uppercase mb-6 flex items-center gap-2">
                        <Sparkles size={18} className="text-yellow-500"/> Meal Tuner
                      </h3>
                      <div className="space-y-6">
                        <div>
                          <div className="flex justify-between text-xs font-black uppercase mb-4">
                            <span>Price Level</span>
                            <span className="text-indigo-600">{priceLevel === '1' ? '$ (Cheap)' : priceLevel === '2' ? '$$ (Moderate)' : '$$$ (Splurge)'}</span>
                          </div>
                          <input type="range" min="1" max="3" value={priceLevel} onChange={e => setPriceLevel(e.target.value)} />
                        </div>
                        <div>
                          <div className="flex justify-between text-xs font-black uppercase mb-4 mt-6">
                            <span>Health Focus</span>
                            <span className="text-lime-600">{healthLevel === '1' ? 'Cheat Meal' : healthLevel === '2' ? 'Balanced' : 'Ultra Clean'}</span>
                          </div>
                          <input type="range" min="1" max="3" value={healthLevel} onChange={e => setHealthLevel(e.target.value)} />
                        </div>
                      </div>
                    </div>

                    <div className="bg-cyan-400 border-4 border-black retro-shadow p-8 text-center">
                      <h2 className="text-2xl font-black mb-4 uppercase">Next Meal</h2>
                      <p className="font-bold text-sm mb-8 text-black/80">Scanning local coordinates and bypassing allergies to find optimal fuel.</p>
                      <button 
                        onClick={generateMealPlan}
                        disabled={aiLoading}
                        className="bg-yellow-400 border-4 border-black font-black py-4 px-8 w-full uppercase retro-shadow-sm retro-btn transition-all flex justify-center items-center gap-2 disabled:opacity-50"
                      >
                        {locationStatus === 'locating' ? <><RefreshCw size={20} className="animate-spin" /> Scanning Satellites...</> :
                         locationStatus === 'acquired' ? <><Target size={20} className="text-lime-700" /> Position Acquired!</> :
                         locationStatus === 'error' ? <><RefreshCw size={20} className="animate-spin" /> Location Bypassed...</> :
                         aiLoading ? <><RefreshCw size={20} className="animate-spin" /> Processing Data...</> : 
                         "Generate Meal"}
                      </button>
                      {aiError && <p className="mt-4 bg-black text-red-400 p-3 font-bold text-xs uppercase border-2 border-red-500">{aiError}</p>}
                    </div>
                  </div>
                ) : (
                  <div className="bg-white border-4 border-black retro-shadow overflow-hidden animate-fade-in">
                    <div className="bg-black text-white p-4 flex justify-between items-center border-b-4 border-black">
                      <div className="font-black uppercase flex items-center gap-2">
                        <MapPin size={16} className="text-lime-400"/> {currentRecommendation.restaurant}
                      </div>
                      <div className="bg-lime-400 text-black px-2 py-1 font-black text-xs border-2 border-white">
                        {currentRecommendation.estimatedPrice}
                      </div>
                    </div>
                    
                    <div className="p-6">
                      <h2 className="text-2xl font-black mb-4 uppercase leading-tight">{currentRecommendation.mealName}</h2>
                      
                      <div className="bg-yellow-100 border-4 border-black p-4 mb-6">
                        <p className="text-xs font-black uppercase mb-2 text-yellow-800">Say This Exactly:</p>
                        <p className="font-bold italic">"{currentRecommendation.orderInstructions}"</p>
                      </div>
                      
                      <div className="grid grid-cols-4 sm:grid-cols-7 gap-2 mb-6 text-center">
                         <div className="border-2 border-black bg-slate-100 col-span-4 sm:col-span-1"><p className="text-[10px] font-black border-b-2 border-black bg-slate-200">KCAL</p><p className="font-black py-1 text-sm">{currentRecommendation.calories}</p></div>
                         <div className="border-2 border-black bg-indigo-100"><p className="text-[10px] font-black border-b-2 border-black bg-indigo-200">PRO</p><p className="font-black py-1 text-sm">{currentRecommendation.protein}</p></div>
                         <div className="border-2 border-black bg-cyan-100"><p className="text-[10px] font-black border-b-2 border-black bg-cyan-200">CRB</p><p className="font-black py-1 text-sm">{currentRecommendation.carbs}</p></div>
                         <div className="border-2 border-black bg-lime-100"><p className="text-[10px] font-black border-b-2 border-black bg-lime-200">FAT</p><p className="font-black py-1 text-sm">{currentRecommendation.fat}</p></div>
                         <div className="border-2 border-black bg-orange-100"><p className="text-[10px] font-black border-b-2 border-black bg-orange-200">FBR</p><p className="font-black py-1 text-sm">{currentRecommendation.fiber}</p></div>
                         <div className="border-2 border-black bg-pink-100"><p className="text-[10px] font-black border-b-2 border-black bg-pink-200">SOD</p><p className="font-black py-1 text-sm">{currentRecommendation.sodium}</p></div>
                         <div className="border-2 border-black bg-blue-100"><p className="text-[10px] font-black border-b-2 border-black bg-blue-200">CAF</p><p className="font-black py-1 text-sm">{currentRecommendation.caffeine}</p></div>
                      </div>

                      <div className="bg-black text-white p-4 border-4 border-white outline outline-4 outline-black mb-6">
                        <p className="text-xs font-black uppercase mb-2 text-cyan-400">AI Analysis:</p>
                        <p className="text-sm font-bold leading-relaxed">{currentRecommendation.hypeText}</p>
                      </div>

                      {/* Map & Directions Section */}
                      <div className="bg-slate-200 border-4 border-black p-4 mb-6">
                        <h3 className="text-sm font-black uppercase mb-3 flex items-center gap-2 text-indigo-900">
                          <MapIcon size={18}/> Target Location
                        </h3>
                        <div className="border-4 border-black mb-4 retro-shadow-sm bg-white">
                          <iframe 
                            width="100%" 
                            height="200" 
                            style={{ border: 0, display: 'block' }} 
                            loading="lazy" 
                            allowFullScreen 
                            src={`https://maps.google.com/maps?q=${encodeURIComponent(currentRecommendation.restaurant)}${userLocation ? `+near+${userLocation.lat},${userLocation.lon}` : ''}&t=&z=14&ie=UTF8&iwloc=&output=embed`}
                          ></iframe>
                        </div>
                        <a 
                          href={`https://www.google.com/maps/dir/?api=1${userLocation ? `&origin=${userLocation.lat},${userLocation.lon}` : ''}&destination=${encodeURIComponent(currentRecommendation.restaurant)}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full bg-cyan-400 border-4 border-black font-black text-black uppercase py-3 retro-shadow-sm retro-btn transition-all flex justify-center items-center gap-2 hover:bg-cyan-300"
                        >
                          <Navigation size={20}/> Initiate Route
                        </a>
                      </div>

                      <div className="flex flex-col sm:flex-row gap-4">
                        <button onClick={logRecommendedMeal} className="flex-1 bg-lime-400 border-4 border-black text-black font-black uppercase py-4 retro-shadow-sm retro-btn transition-all flex justify-center items-center gap-2">
                          <CheckCircle2 size={20}/> Log It
                        </button>
                        <button onClick={() => setCurrentRecommendation(null)} className="bg-white border-4 border-black text-black font-black uppercase py-4 px-6 retro-shadow-sm retro-btn transition-all">
                          Skip
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* --- CONSOLIDATED SETTINGS TAB --- */}
            {activeTab === 'settings' && (
              <div className="space-y-8 animate-fade-in">

                {/* SECTION 1: SYSTEM CONFIG (API Key & Model Selection) */}
                <div className="bg-slate-200 border-4 border-black retro-shadow p-6 sm:p-8">
                  <h2 className="text-xl font-black uppercase mb-4 border-b-4 border-black pb-2 flex items-center gap-2">
                    <SettingsIcon size={22}/> System Config
                  </h2>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-black uppercase mb-2">Active AI Model</label>
                      <select 
                        value={selectedModel} 
                        onChange={(e) => setSelectedModel(e.target.value)}
                        className="w-full border-4 border-black p-3 font-bold bg-white outline-none focus:bg-yellow-100"
                      >
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Default/Fastest)</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Stable)</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro (Advanced Reasoning)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-black uppercase mb-2">API Key</label>
                      <div className="flex flex-col sm:flex-row gap-2">
                        <input 
                          type="password" 
                          value={apiKey ? "••••••••••••••••••••••••••••" : ""} 
                          disabled 
                          className="flex-1 w-full px-4 py-3 bg-slate-300 border-4 border-black font-bold outline-none"
                        />
                        <button onClick={clearApiKey} className="w-full sm:w-auto px-6 py-3 bg-black text-white font-black uppercase retro-btn border-4 border-black hover:bg-slate-800 transition-colors">Reset</button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* SECTION 2: PLAYER PROFILE */}
                <form onSubmit={handleSaveProfile} className="bg-white border-4 border-black retro-shadow p-6 sm:p-8">
                  <h2 className="text-xl font-black uppercase mb-6 border-b-4 border-black pb-2 flex items-center gap-2">
                    <UserIcon size={22}/> Player Profile
                  </h2>
                  
                  <div className="space-y-6 mb-8">
                    {/* Name Input */}
                    <div>
                      <label className="block text-xs font-black uppercase mb-1">Player Name</label>
                      <input type="text" placeholder="e.g. Master Chief" value={profile?.name || ''} onChange={e => setProfile({...profile, name: e.target.value})} className="w-full border-4 border-black p-2 font-bold bg-slate-50 outline-none focus:bg-yellow-100" />
                    </div>

                    {/* Stats Row 1 */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Age</label>
                        <input type="number" required value={profile?.age || ''} onChange={e => setProfile({...profile, age: e.target.value})} className="w-full border-4 border-black p-2 font-bold bg-slate-50 outline-none focus:bg-yellow-100" />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Wt (lbs)</label>
                        <input type="number" required value={profile?.weight || ''} onChange={e => setProfile({...profile, weight: e.target.value})} className="w-full border-4 border-black p-2 font-bold bg-slate-50 outline-none focus:bg-yellow-100" />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Ht (in)</label>
                        <input type="number" required value={profile?.height || ''} onChange={e => setProfile({...profile, height: e.target.value})} className="w-full border-4 border-black p-2 font-bold bg-slate-50 outline-none focus:bg-yellow-100" />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Sex</label>
                        <select value={profile?.sex || 'male'} onChange={e => setProfile({...profile, sex: e.target.value})} className="w-full border-4 border-black p-2 font-bold bg-slate-50 outline-none focus:bg-yellow-100">
                          <option value="male">Male</option>
                          <option value="female">Female</option>
                        </select>
                      </div>
                    </div>

                    {/* Goal & Activity */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Class / Goal</label>
                        <select value={profile?.goal || 'maintain'} onChange={e => setProfile({...profile, goal: e.target.value})} className="w-full border-4 border-black p-2 font-bold bg-slate-50 outline-none focus:bg-yellow-100">
                          <option value="lose">Lose Weight (Cut)</option>
                          <option value="maintain">Maintain</option>
                          <option value="build">Build Muscle (Bulk)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Activity Level</label>
                        <select value={profile?.activityLevel || 1.375} onChange={e => setProfile({...profile, activityLevel: e.target.value})} className="w-full border-4 border-black p-2 font-bold bg-slate-50 outline-none focus:bg-yellow-100">
                          <option value="1.2">Sedentary (Desk Job)</option>
                          <option value="1.375">Light (1-3 days/wk)</option>
                          <option value="1.55">Moderate (3-5 days/wk)</option>
                          <option value="1.725">Active (6-7 days/wk)</option>
                        </select>
                      </div>
                    </div>

                    {/* Diet & Allergies */}
                    <div className="bg-red-50 border-4 border-red-500 p-4 relative mt-6">
                      <span className="absolute -top-3 left-4 bg-red-500 text-white font-black text-[10px] px-2 uppercase border-2 border-black flex items-center gap-1">
                        <ShieldAlert size={12}/> Danger Zone
                      </span>
                      <label className="block text-xs font-black uppercase mb-1 text-red-900 mt-2">Debuffs / Allergies (Comma Separated)</label>
                      <textarea 
                        value={profile?.allergies || ''} 
                        onChange={e => setProfile({...profile, allergies: e.target.value})} 
                        placeholder="e.g. Peanuts, Spinach, Shellfish"
                        className="w-full border-4 border-black p-2 font-bold bg-white outline-none focus:bg-yellow-100 h-20 placeholder-slate-300" 
                      />
                      <p className="text-[10px] font-bold mt-1 text-red-600">AI will be strictly forbidden from suggesting these.</p>
                    </div>
                    
                    <div className="mt-6">
                      <label className="block text-xs font-black uppercase mb-1">Diet Preference (Buffs)</label>
                      <select value={profile?.dietPreference || 'Any'} onChange={e => setProfile({...profile, dietPreference: e.target.value})} className="w-full border-4 border-black p-3 font-bold bg-slate-50 outline-none focus:bg-yellow-100">
                        <option value="Any">Any / No Restriction</option>
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Vegan">Vegan</option>
                        <option value="Pescatarian">Pescatarian</option>
                        <option value="Keto">Keto</option>
                        <option value="Paleo">Paleo</option>
                        <option value="Mediterranean">Mediterranean</option>
                        <option value="Gluten-Free">Gluten-Free</option>
                        <option value="Dairy-Free">Dairy-Free</option>
                      </select>
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-cyan-400 border-4 border-black font-black text-lg uppercase py-4 retro-shadow-sm retro-btn transition-all flex justify-center items-center gap-2">
                    <Sparkles size={20}/> Save & Sync Stats
                  </button>
                </form>

                {/* SECTION 3: MEAL LOG / HISTORY */}
                <div className="bg-indigo-50 border-4 border-black retro-shadow p-6 sm:p-8">
                  <h2 className="text-xl font-black uppercase mb-6 border-b-4 border-black pb-2 flex items-center gap-2">
                    <Book size={22}/> Meal Log
                  </h2>
                  {(meals || []).length === 0 ? (
                    <div className="bg-white border-4 border-black p-8 text-center border-dashed">
                      <p className="font-black uppercase">NO DATA FOUND.</p>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {(meals || []).map((meal, idx) => (
                        <div key={meal?.id || idx} className="bg-white border-4 border-black retro-shadow-sm p-4 flex justify-between items-center gap-4">
                          <div>
                            <p className="font-black uppercase text-lg leading-tight">{meal?.name || 'Unknown Meal'}</p>
                            <p className="text-xs font-bold mt-1 bg-yellow-200 inline-block px-2 border-2 border-black">
                              {meal?.calories || 0} KCAL
                            </p>
                          </div>
                          <button onClick={() => handleDeleteMeal(meal?.id || meal?.name)} className="bg-red-400 text-white border-2 border-black p-3 retro-btn transition-all shrink-0"><Trash2 size={20}/></button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
